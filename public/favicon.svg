<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10172b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1a4478" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle with Website Navy Tone -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#1a4478" stroke-width="2" stroke-opacity="0.8" />

  <!-- Biomedical ECG / Biosignal Pulse Waveform (No letters or text) -->
  <path
    d="M 8 32 L 20 32 L 23 27 L 27 35 L 32 12 L 37 50 L 41 29 L 45 32 L 56 32"
    fill="none"
    stroke="#f2eee6"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Subtle Bio-Sensor Pulse Node at Baseline End -->
  <circle cx="56" cy="32" r="2.5" fill="#f2eee6" />
</svg>
